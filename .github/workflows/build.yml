name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    name: Import & offscreen smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxcb-cursor0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile all modules
        run: python -m compileall -q adguard_gui
      - name: Offscreen smoke run
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          timeout 8 python main.py || code=$?
          if [ "${code:-0}" -eq 124 ]; then exit 0; fi
          exit "${code:-0}"

  deb:
    name: Build .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: |
          sudo apt-get update -y
          # Qt runtime нужен для scripts/generate_icons.py — PySide6 при
          # импорте тащит libEGL/libGL даже в offscreen-режиме.
          sudo apt-get install -y --no-install-recommends \
            dpkg rsync \
            libegl1 libgl1 libxkbcommon0 libxcb-cursor0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libfontconfig1
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build deb
        env:
          QT_QPA_PLATFORM: offscreen
        run: make deb
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: adguard-gui-deb
          path: build/*.deb
          if-no-files-found: error
